    <h1>Fotball Quiz</h1>
    <section>


        <div class="container">
            <p id="tekst"></p>
            <button class="svar" id="svar0" onclick="svar(0)"></button>
            <button class="svar" id="svar1" onclick="svar(1)"></button>
            <button class="svar" id="svar2" onclick="svar(2)"></button>
            <div class="piler">
                <button onclick="forrige()">←</button>
                <span id="teller"></span>
                <button onclick="neste()">→</button>
            </div>

        </div>

    </section>

    <footer>
    
        <span>Av Anne Helene Bjune Bjerve</span>
        <span> Heia Norge</span>
    

    </footer>


    <script>
        const sporsmal = [
            { tekst: "Hvor arrangeres VM 2026?", svar: ["Brasil", "USA/Canada/Mexico", "Europa"], riktig: 1 },
            { tekst: "Hvor mange lag deltar?", svar: ["32", "48", "64"], riktig: 1 },
            { tekst: "Hvem er regjerende verdensmester?", svar: ["Frankrike", "Brasil", "Argentina"], riktig: 2 },
            { tekst: "Hvilken by er IKKE VM-vert?", svar: ["New York", "Rio de Janeiro", "Los Angeles"], riktig: 1 },
            { tekst: "Hvem vant VM i 2018?", svar: ["Kroatia", "Frankrike", "Belgia"], riktig: 1 },
            { tekst: "Hvem vant VM i 2022?", svar: ["Frankrike", "Brasil", "Argentina"], riktig: 2 }
        ];

        let nr = 0;

        function vis() {
            document.getElementById('tekst').textContent = sporsmal[nr].tekst;
            document.getElementById('svar0').textContent = sporsmal[nr].svar[0];
            document.getElementById('svar1').textContent = sporsmal[nr].svar[1];
            document.getElementById('svar2').textContent = sporsmal[nr].svar[2];
            document.getElementById('svar0').style.background = '';
            document.getElementById('svar1').style.background = '';
            document.getElementById('svar2').style.background = '';
        }

        function svar(i) {
            document.getElementById('svar' + i).style.background = i === sporsmal[nr].riktig ? 'green' : 'red';
        }

        function neste() { nr++; vis(); }
        function forrige() { nr--; vis(); }

        vis();
    </script>
