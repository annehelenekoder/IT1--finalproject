    <section>
        <div class="innpakning">
            <h2>Hypotetisk spilleroppsett til Vm</h2>
            <div class="bane">
                <div class="midtlinje"></div>
                <div class="midtsirkel"></div>
                <div class="rad">
                    <div class="spiller" onclick="vis(this, 'Antonio Nusa · RB Leipzig')">Nusa</div>
                    <div class="spiller" onclick="vis(this, 'Erling Haaland · Man City')">Haaland</div>
                    <div class="spiller" onclick="vis(this, 'A. Schjelderup · Benfica')">Schjelderup</div>
                </div>
                <div class="rad">
                    <div class="spiller" onclick="vis(this, 'Sander Berge · Fulham')">Berge</div>
                    <div class="spiller" onclick="vis(this, 'Martin Ødegaard · Arsenal')">Ødegaard</div>
                    <div class="spiller" onclick="vis(this, 'Fredrik Aursnes · Benfica')">Aursnes</div>
                </div>
                <div class="rad">
                    <div class="spiller" onclick="vis(this, 'Julian Ryerson · Dortmund')">Ryerson</div>
                    <div class="spiller" onclick="vis(this, 'Kristoffer Ajer · Brentford')">Ajer</div>

    <script>
        function vis(spiller, tekst) {
            document.querySelectorAll('.spiller').forEach(s => s.classList.remove('valgt'));
            spiller.classList.add('valgt');
            document.getElementById('spillerinfo').textContent = tekst;
        }
    </script>
